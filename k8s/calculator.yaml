apiVersion: apps/v1
kind: Deployment

metadata:
  name: calculator-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: calculator

  template:
    metadata:
      labels:
        app: calculator

    spec:
      containers:
      - name: calculator-container

        image: zubairzone/calculator-app:v.01

        ports:
        - containerPort: 8081

---

apiVersion: v1
kind: Service

metadata:
  name: calculator-service

spec:
  type: LoadBalancer

  selector:
    app: calculator

  ports:
  - port: 80
    targetPort: 8081

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: calculator-ingress

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:

  ingressClassName: nginx

  rules:
  - host: calculator.local

    http:

      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: calculator-service

            port:
              number: 80