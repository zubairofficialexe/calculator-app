apiVersion: v1
kind: Namespace

metadata:
  name: calci

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: calculator-deployment
  namespace: calci

spec:
  replicas: 2

  selector:
    matchLabels:
      app: calculator

  template:
    metadata:
      labels:
        app: calculator

    spec:

      containers:
      - name: calculator-container

        image: zubairzone/calculator-app:v.03

        ports:
        - containerPort: 8081

---

apiVersion: v1
kind: Service

metadata:
  name: calculator-service
  namespace: calci

spec:
  type: ClusterIP

  selector:
    app: calculator

  ports:
  - port: 80
    targetPort: 8081

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: calculator-ingress
  namespace: calci

  annotations:

    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

spec:

  ingressClassName: alb

  rules:
  - http:

      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: calculator-service

            port:
              number: 80